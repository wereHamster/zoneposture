[package]
name = "zoneposture"
version = "0.1.0"
edition = "2024"
description = "Audits a DNS zone against modern web security standards"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
domain = { version = "0.12.3", default-features = false, features = ["zonefile"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = "0.2.40"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
